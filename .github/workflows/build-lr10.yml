name: Build ЛР 10 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lab10/**"
      - ".github/workflows/build-lr10.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK platform
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: lab10

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: lab10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lab10-debug-apk
          path: lab10/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
